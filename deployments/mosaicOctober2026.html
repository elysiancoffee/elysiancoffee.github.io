<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Impostor Check</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: transparent;
        }

        #contest-image {
            display: block;
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        #impostor-message {
            display: none;
            font-family: Arial, sans-serif;
            font-size: clamp(28px, 5vw, 64px);
            font-weight: 800;
            text-align: center;
            color: #000;
        }
    </style>
</head>

<body>

    <img
        id="contest-image"
        src="https://cdn.origo.hu/2023/12/XBy5mJn0OvisGDgMpS88kiUmX3v5xPQauBhLLtciNvI/fill/1347/758/no/1/aHR0cHM6Ly9jbXNjZG4uYXBwLmNvbnRlbnQucHJpdmF0ZS9jb250ZW50LzBiYTgwODY4NTA3NTRkZTliYTUxZDMyZmJjN2I0MGM4.webp"
        alt="Contest Image"
    >

    <div id="impostor-message">
        YOU ARE AN IMPOSTOR
    </div>

    <script>
        window.addEventListener("message", function(event) {
            if (event.data?.type !== "IMPOSTOR_RESULT") {
                return;
            }

            if (event.data.impostor === true) {
                document.getElementById("contest-image").style.display = "none";
                document.getElementById("impostor-message").style.display = "block";
            } else {
                document.getElementById("contest-image").style.display = "block";
                document.getElementById("impostor-message").style.display = "none";
            }
        });
    </script>

</body>
</html>
