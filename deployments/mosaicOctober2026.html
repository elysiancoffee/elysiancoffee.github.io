<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Impostor Check</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #contest-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        #impostor-message {
            display: none;

            font-family: Arial, sans-serif;
            font-size: clamp(28px, 5vw, 64px);
            font-weight: 800;
            text-align: center;
        }
    </style>
</head>

<body>

    <img
        id="image"
        src="https://cdn.origo.hu/2023/12/XBy5mJn0OvisGDgMpS88kiUmX3v5xPQauBhLLtciNvI/fill/1347/758/no/1/aHR0cHM6Ly9jbXNjZG4uYXBwLmNvbnRlbnQucHJpdmF0ZS9jb250ZW50LzBiYTgwODY4NTA3NTRkZTliYTUxZDMyZmJjN2I0MGM4.webp"
        alt="Contest image"
    >

    <div id="impostor-message">
        YOU ARE AN IMPOSTOR
    </div>

    <script>

        const image = document.getElementById("contest-image");
        const message = document.getElementById("impostor-message");


        window.addEventListener("message", function(event) {

            /*
             * The main site sends:
             *
             * {
             *     type: "IMPOSTOR_CHECK",
             *     username: "B",
             *     impostors: ["A", "C", "D"]
             * }
             */

            if (!event.data) {
                return;
            }

            if (event.data.type !== "IMPOSTOR_CHECK") {
                return;
            }


            const username = String(event.data.username || "")
                .trim()
                .toLowerCase();

            const impostors = Array.isArray(event.data.impostors)
                ? event.data.impostors
                : [];


            /*
             * Check whether THIS user is an impostor.
             */

            const isImpostor = impostors.some(function(impostor) {

                return String(impostor)
                    .trim()
                    .toLowerCase() === username;

            });


            /*
             * Display the appropriate thing.
             */

            if (isImpostor) {

                image.style.display = "none";
                message.style.display = "block";

            } else {

                image.style.display = "block";
                message.style.display = "none";

            }

        });

    </script>

</body>
</html>
